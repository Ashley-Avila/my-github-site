<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashley's Website</title>
    <!-- Importing bubbly and extra round fonts from Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
      /* Define colors and environment for Light Mode (Default) */
      :root {
        --background-color: #E6F2FF; /* Soft, pastel light blue background */
        --card-background: rgba(255, 255, 255, 0.85); /* Translucent white for overlay effect */
        --text-color: #1A365D;       /* Dark blue text for great readability */
        --heading-primary: #004080;   /* Deep blue heading */
        --heading-secondary: #0066CC; /* Bright blue secondary heading */
        --link-color: #D2143A;       /* Vibrant contrast color for links */
        --card-shadow: rgba(0, 64, 128, 0.08); /* Soft shadow for app depth */
        
        /* Window specific variables */
        --sky-color: linear-gradient(to bottom, #7ac1eb, #bfe3f7);
        --sun-moon-opacity: 1;
        --moon-opacity: 0;
        --tree-color-1: #4CAF50;
        --tree-color-2: #388E3C;
        --window-frame: #ffffff;
        --leaf-color-1: #FF8A65; /* Warm autumn orange leaf */
        --leaf-color-2: #FFD54F; /* Soft yellow leaf */
      }

      /* Define colors and environment for Dark Mode */
      [data-theme="dark"] {
        --background-color: #0B192C; /* Deep, rich navy blue background */
        --card-background: rgba(30, 62, 98, 0.85);  /* Translucent navy */
        --text-color: #E2F1E7;       /* Soft off-white text for easy reading */
        --heading-primary: #60A5FA;   /* Bright pastel blue heading */
        --heading-secondary: #93C5FD; /* Lighter pastel blue secondary heading */
        --link-color: #F87171;       /* Coral/pink accent color for links */
        --card-shadow: rgba(0, 0, 0, 0.3); /* Darker shadow for high contrast */
        
        /* Window specific variables */
        --sky-color: linear-gradient(to bottom, #0f172a, #1e1b4b);
        --sun-moon-opacity: 0;
        --moon-opacity: 1;
        --tree-color-1: #1b4332;
        --tree-color-2: #081c15;
        --window-frame: #1e293b;
        --leaf-color-1: #b84a39; /* Deep rust leaf for dark mode */
        --leaf-color-2: #d4a326; /* Darker amber leaf for dark mode */
      }

      /* Animated Scenic Window View Background */
      .scenic-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        background: var(--sky-color);
        overflow: hidden;
        transition: background 0.5s ease;
      }

      /* Window Frame Overlay */
      .window-pane {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        border: 20px solid var(--window-frame);
        pointer-events: none; /* Allows scrolling through the frame border if necessary */
        transition: border-color 0.5s ease;
        z-index: 3; /* Placed in front of everything outside */
      }
      .window-pane::before {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        width: 10px;
        height: 100%;
        background: var(--window-frame);
        transform: translateX(-50%);
        transition: background 0.5s ease;
      }
      .window-pane::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        height: 10px;
        background: var(--window-frame);
        transform: translateY(-50%);
        transition: background 0.5s ease;
      }

      /* Sun Graphic */
      .sun {
        position: absolute;
        top: 80px;
        right: 15%;
        width: 70px;
        height: 70px;
        background: #ffde59;
        border-radius: 50%;
        box-shadow: 0 0 30px #ffde59;
        opacity: var(--sun-moon-opacity);
        transition: transform 0.5s ease, opacity 0.5s ease;
        transform: translateY(calc((1 - var(--sun-moon-opacity)) * -150px));
      }

      /* Moon Graphic */
      .moon {
        position: absolute;
        top: 80px;
        left: 15%;
        width: 60px;
        height: 60px;
        background: #f1f5f9;
        border-radius: 50%;
        box-shadow: 0 0 25px rgba(241, 245, 249, 0.6);
        opacity: var(--moon-opacity);
        transition: transform 0.5s ease, opacity 0.5s ease;
        transform: translateY(calc((1 - var(--moon-opacity)) * -150px));
      }

      /* Container for outdoor blowing trees */
      .scenery-container {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 40%;
        display: flex;
        justify-content: space-around;
        align-items: flex-end;
        padding: 0 40px;
        box-sizing: border-box;
        z-index: 1;
      }

      /* Custom animation for blowing wind effect */
      @keyframes blow {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-6deg) skewX(-4deg); }
      }

      .tree {
        position: relative;
        width: 0;
        height: 0;
        border-left: 45px solid transparent;
        border-right: 45px solid transparent;
        transform-origin: bottom center;
        animation: blow 4s ease-in-out infinite;
        transition: border-bottom-color 0.5s ease;
      }

      /* Variations in speed and sizing to make the wind feel realistic */
      .tree-1 {
        border-bottom: 160px solid var(--tree-color-1);
        animation-duration: 3.5s;
        animation-delay: -0.5s;
      }
      .tree-2 {
        border-bottom: 130px solid var(--tree-color-2);
        animation-duration: 4.2s;
        animation-delay: -1.2s;
      }
      .tree-3 {
        border-bottom: 180px solid var(--tree-color-1);
        animation-duration: 3.8s;
        animation-delay: -0.2s;
      }
      .tree-4 {
        border-bottom: 140px solid var(--tree-color-2);
        animation-duration: 4.5s;
        animation-delay: -2s;
      }

      /* Falling Leaves Container & System */
      .leaves-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 2; /* Placed between the trees and the window glass pane */
        pointer-events: none;
      }

      /* Animations for falling and swaying */
      @keyframes fall {
        0% {
          top: -5%;
        }
        100% {
          top: 105%;
        }
      }

      @keyframes sway {
        0%, 100% { transform: translateX(0) rotate(0deg); }
        50% { transform: translateX(80px) rotate(180deg); }
      }

      .leaf {
        position: absolute;
        width: 15px;
        height: 22px;
        border-radius: 0 100% 0 100%; /* Creates an organic leaf shape */
        animation: fall 7s linear infinite, sway 3s ease-in-out infinite;
        transition: background-color 0.5s ease;
      }

      /* Varied configurations for individual falling leaf coordinates and frequencies */
      .leaf:nth-child(1) { left: 10%; background-color: var(--leaf-color-1); animation-duration: 8s, 3s; animation-delay: 0s, 0s; }
      .leaf:nth-child(2) { left: 25%; background-color: var(--leaf-color-2); animation-duration: 6s, 2.5s; animation-delay: 1.5s, 0.5s; }
      .leaf:nth-child(3) { left: 45%; background-color: var(--leaf-color-1); animation-duration: 9s, 3.5s; animation-delay: 0.5s, 1s; }
      .leaf:nth-child(4) { left: 60%; background-color: var(--leaf-color-2); animation-duration: 7s, 2.8s; animation-delay: 3s, 0s; }
      .leaf:nth-child(5) { left: 75%; background-color: var(--leaf-color-1); animation-duration: 8.5s, 3.2s; animation-delay: 2s, 1.5s; }
      .leaf:nth-child(6) { left: 90%; background-color: var(--leaf-color-2); animation-duration: 6.5s, 2.4s; animation-delay: 4.5s, 0.2s; }

      body { 
        font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif; 
        max-width: 800px;
        margin: 0 auto; 
        padding: 20px; 
        color: var(--text-color);
        position: relative;
        z-index: 4; /* Keeps content panels safe above the fixed view layer */
        transition: color 0.3s; 
      }

      /* Header container to align title and theme switch nicely */
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
        margin-bottom: 30px;
        background: var(--card-background);
        padding: 15px 25px;
        border-radius: 20px;
        box-shadow: 0 4px 15px var(--card-shadow);
        backdrop-filter: blur(8px);
        transition: background-color 0.3s, box-shadow 0.3s;
      }
      
      h1 { 
        font-family: 'DynaPuff', cursive, sans-serif;
        color: var(--heading-primary); 
        font-size: 2.8rem;
        font-weight: 700; 
        letter-spacing: 0.5px; 
        margin: 0;
      }

      main {
        display: flex;
        flex-direction: column;
        gap: 20px; 
      }

      .app-section {
        background-color: var(--card-background);
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 4px 15px var(--card-shadow);
        backdrop-filter: blur(8px); /* Creates a glassmorphism blend against the moving scenery */
        transition: background-color 0.3s, box-shadow 0.3s;
      }

      h2 { 
        color: var(--heading-secondary); 
        border-bottom: 3px solid var(--heading-secondary); 
        font-weight: 500; 
        padding-bottom: 4px; 
        margin-top: 0; 
      }
      
      p  { line-height: 1.6; font-weight: 400; font-size: 1.1rem; margin-bottom: 0; }
